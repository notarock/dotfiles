onboarding = false

[ui]
status_indicators = "symbols"
sidebar_width = 39

# $mr is reported by the gl-status skill (draft / ready / merged / closed).
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$mr", fg = "#f9e2af", rules = [
    { contains = "ready", fg = "#a6e3a1", bold = true },
    { contains = "draft", fg = "#f9e2af" },
    { contains = "merged", fg = "#89b4fa", dim = true },
    { contains = "closed", fg = "#f38ba8", dim = true },
  ]}],
]

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
